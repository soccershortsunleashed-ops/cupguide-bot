{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-5">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="text-white text-3xl font-bold mb-2">📋 Заявки</h1>
            <p class="text-gray-400">Лиды из фриланс-воронки бота</p>
        </div>
    </div>

    <!-- Статистика -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="glassmorphic rounded-lg p-4 mb-4">
                <h2 class="text-white text-xl font-semibold mb-3">📊 Статистика воронки</h2>
                <div id="funnelStats" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-gray-800/50 rounded-lg p-3 text-center">
                        <div class="text-3xl font-bold text-white" id="statTotal">0</div>
                        <div class="text-gray-400 text-sm">Всего лидов</div>
                    </div>
                    <div class="bg-green-900/30 rounded-lg p-3 text-center">
                        <div class="text-3xl font-bold text-green-400" id="statGradeA">0</div>
                        <div class="text-gray-400 text-sm">Грейд A</div>
                    </div>
                    <div class="bg-yellow-900/30 rounded-lg p-3 text-center">
                        <div class="text-3xl font-bold text-yellow-400" id="statGradeB">0</div>
                        <div class="text-gray-400 text-sm">Грейд B</div>
                    </div>
                    <div class="bg-blue-900/30 rounded-lg p-3 text-center">
                        <div class="text-3xl font-bold text-blue-400" id="statConversion">0%</div>
                        <div class="text-gray-400 text-sm">Конверсия</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Фильтры -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="glassmorphic rounded-lg p-4">
                <div class="flex flex-wrap gap-3 items-center">
                    <select id="filterGrade" class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm">
                        <option value="">Все грейды</option>
                        <option value="A">A (взрослые)</option>
                        <option value="B">B (прототип)</option>
                        <option value="TRASH">TRASH</option>
                    </select>
                    <select id="filterStatus" class="px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm">
                        <option value="">Все статусы</option>
                        <option value="NEW">Новые</option>
                        <option value="IN_REVIEW">На рассмотрении</option>
                        <option value="CONTACTED">Связались</option>
                        <option value="WON">Выиграны</option>
                        <option value="LOST">Потеряны</option>
                    </select>
                    <button onclick="loadLeads()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition-colors">
                        <span class="material-symbols-outlined align-middle mr-1" style="font-size: 18px;">refresh</span>
                        Обновить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Таблица заявок -->
    <div class="row">
        <div class="col-12">
            <div class="glassmorphic rounded-lg p-4">
                <h2 class="text-white text-xl font-semibold mb-3">Список заявок</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-gray-400 border-b border-gray-700">
                            <tr>
                                <th class="px-3 py-3">ID</th>
                                <th class="px-3 py-3">Пользователь</th>
                                <th class="px-3 py-3">Грейд</th>
                                <th class="px-3 py-3">Маршрут</th>
                                <th class="px-3 py-3">Контакт</th>
                                <th class="px-3 py-3">Ниша</th>
                                <th class="px-3 py-3">Статус</th>
                                <th class="px-3 py-3">Дата</th>
                                <th class="px-3 py-3">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTableBody" class="text-gray-300">
                            <tr>
                                <td colspan="9" class="px-3 py-8 text-center text-gray-500">
                                    <span class="material-symbols-outlined animate-spin">progress_activity</span>
                                    Загрузка...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно деталей лида -->
<div id="leadDetailModal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4">
    <div class="glassmorphic rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-white text-xl font-semibold">Детали заявки #<span id="modalLeadId"></span></h3>
                <button onclick="closeLeadModal()" class="text-gray-400 hover:text-white">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="modalContent" class="space-y-4">
                <!-- Контент загружается динамически -->
            </div>
        </div>
    </div>
</div>

<script>
// Загрузка статистики
async function loadStats() {
    try {
        const resp = await fetch('/api/leads/stats');
        if (resp.ok) {
            const stats = await resp.json();
            document.getElementById('statTotal').textContent = stats.total || 0;
            document.getElementById('statGradeA').textContent = stats.by_grade?.A || 0;
            document.getElementById('statGradeB').textContent = stats.by_grade?.B || 0;
            document.getElementById('statConversion').textContent = (stats.conversion_rate || 0).toFixed(1) + '%';
        }
    } catch (e) {
        console.error('Error loading stats:', e);
    }
}

// Загрузка лидов
async function loadLeads() {
    const grade = document.getElementById('filterGrade').value;
    const status = document.getElementById('filterStatus').value;
    
    let url = '/api/leads/?limit=100';
    if (grade) url += `&grade=${grade}`;
    if (status) url += `&status=${status}`;
    
    try {
        const resp = await fetch(url);
        if (resp.ok) {
            const leads = await resp.json();
            renderLeads(leads);
        } else {
            document.getElementById('leadsTableBody').innerHTML = `
                <tr><td colspan="9" class="px-3 py-8 text-center text-red-400">Ошибка загрузки</td></tr>
            `;
        }
    } catch (e) {
        console.error('Error loading leads:', e);
        document.getElementById('leadsTableBody').innerHTML = `
            <tr><td colspan="9" class="px-3 py-8 text-center text-red-400">Ошибка: ${e.message}</td></tr>
        `;
    }
}

// Рендер таблицы
function renderLeads(leads) {
    const tbody = document.getElementById('leadsTableBody');
    
    if (!leads || leads.length === 0) {
        tbody.innerHTML = `
            <tr><td colspan="9" class="px-3 py-8 text-center text-gray-500">Заявок пока нет</td></tr>
        `;
        return;
    }
    
    tbody.innerHTML = leads.map(lead => {
        const gradeColors = {
            'A': 'bg-green-500/20 text-green-400',
            'B': 'bg-yellow-500/20 text-yellow-400',
            'TRASH': 'bg-red-500/20 text-red-400'
        };
        const routeLabels = {
            'A_FLOW': 'A Flow',
            'B_FLOW': 'B Flow',
            'TRASH_FLOW': 'Trash'
        };
        const statusColors = {
            'NEW': 'bg-blue-500/20 text-blue-400',
            'IN_REVIEW': 'bg-yellow-500/20 text-yellow-400',
            'CONTACTED': 'bg-purple-500/20 text-purple-400',
            'WON': 'bg-green-500/20 text-green-400',
            'LOST': 'bg-red-500/20 text-red-400'
        };
        
        const date = new Date(lead.created_at).toLocaleDateString('ru-RU');
        const username = lead.username ? `@${lead.username}` : lead.first_name || `ID: ${lead.telegram_user_id}`;
        const niche = lead.niche_text ? (lead.niche_text.length > 30 ? lead.niche_text.substring(0, 30) + '...' : lead.niche_text) : '-';
        
        return `
            <tr class="border-b border-gray-700/50 hover:bg-white/5">
                <td class="px-3 py-3 font-mono">${lead.id}</td>
                <td class="px-3 py-3">
                    <div class="font-medium text-white">${username}</div>
                    <div class="text-xs text-gray-500">${lead.first_name || ''} ${lead.last_name || ''}</div>
                </td>
                <td class="px-3 py-3">
                    <span class="px-2 py-1 rounded text-xs ${gradeColors[lead.llm_grade] || 'bg-gray-500/20 text-gray-400'}">
                        ${lead.llm_grade || '-'}
                    </span>
                </td>
                <td class="px-3 py-3 text-xs">${routeLabels[lead.final_route] || '-'}</td>
                <td class="px-3 py-3">
                    <div class="text-xs">${lead.contact_preferred || '-'}</div>
                </td>
                <td class="px-3 py-3 text-xs max-w-[150px] truncate" title="${lead.niche_text || ''}">${niche}</td>
                <td class="px-3 py-3">
                    <span class="px-2 py-1 rounded text-xs ${statusColors[lead.status] || 'bg-gray-500/20 text-gray-400'}">
                        ${lead.status}
                    </span>
                </td>
                <td class="px-3 py-3 text-xs text-gray-400">${date}</td>
                <td class="px-3 py-3">
                    <button onclick="showLeadDetail(${lead.id})" class="text-blue-400 hover:text-blue-300 text-xs">
                        Подробнее
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

// Показать детали лида
async function showLeadDetail(leadId) {
    document.getElementById('modalLeadId').textContent = leadId;
    document.getElementById('leadDetailModal').classList.remove('hidden');
    document.getElementById('modalContent').innerHTML = '<div class="text-center text-gray-400">Загрузка...</div>';
    
    try {
        const resp = await fetch(`/api/leads/${leadId}`);
        if (resp.ok) {
            const lead = await resp.json();
            renderLeadDetail(lead);
        }
    } catch (e) {
        document.getElementById('modalContent').innerHTML = `<div class="text-red-400">Ошибка: ${e.message}</div>`;
    }
}

// Рендер деталей лида
function renderLeadDetail(lead) {
    const goalLabels = {
        'sales': '💰 Продажи',
        'leads': '📥 Заявки',
        'base': '🧲 Лиды/база',
        'support': '🧰 Поддержка',
        'just_bot': '🤷 Просто бот'
    };
    const painLabels = {
        'traffic': '🚪 Вход/трафик',
        'dialog': '💬 Диалог без результата',
        'payment': '💳 До оплаты не доходят',
        'integration': '🔁 Автоматизация',
        'chaos': '🧨 Хаос'
    };
    const contextLabels = {
        'from_scratch': '🆕 С нуля',
        'after_constructor': '🧱 После конструктора',
        'has_bot': '🤖 Есть бот',
        'has_crm': '🧩 Есть CRM'
    };
    
    document.getElementById('modalContent').innerHTML = `
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-800/50 rounded-lg p-3">
                <div class="text-gray-400 text-xs mb-1">Telegram</div>
                <div class="text-white">${lead.username ? '@' + lead.username : 'ID: ' + lead.telegram_user_id}</div>
                <div class="text-gray-400 text-sm">${lead.first_name || ''} ${lead.last_name || ''}</div>
            </div>
            <div class="bg-gray-800/50 rounded-lg p-3">
                <div class="text-gray-400 text-xs mb-1">Контакт</div>
                <div class="text-white">${lead.contact_preferred || '-'}</div>
            </div>
        </div>
        
        <div class="bg-gray-800/50 rounded-lg p-3">
            <div class="text-gray-400 text-xs mb-2">Скрининг</div>
            <div class="space-y-1 text-sm">
                <div><span class="text-gray-400">Цель:</span> <span class="text-white">${goalLabels[lead.goal] || lead.goal || '-'}</span></div>
                <div><span class="text-gray-400">Боль:</span> <span class="text-white">${painLabels[lead.pain] || lead.pain || '-'}</span></div>
                <div><span class="text-gray-400">Контекст:</span> <span class="text-white">${contextLabels[lead.context] || lead.context || '-'}</span></div>
            </div>
        </div>
        
        <div class="bg-gray-800/50 rounded-lg p-3">
            <div class="text-gray-400 text-xs mb-2">Ниша</div>
            <div class="text-white text-sm">${lead.niche_text || '-'}</div>
        </div>
        
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-gray-800/50 rounded-lg p-3 text-center">
                <div class="text-gray-400 text-xs mb-1">Грейд</div>
                <div class="text-2xl font-bold ${lead.llm_grade === 'A' ? 'text-green-400' : lead.llm_grade === 'B' ? 'text-yellow-400' : 'text-red-400'}">${lead.llm_grade || '-'}</div>
            </div>
            <div class="bg-gray-800/50 rounded-lg p-3 text-center">
                <div class="text-gray-400 text-xs mb-1">Скор</div>
                <div class="text-2xl font-bold text-white">${lead.llm_score || '-'}</div>
            </div>
            <div class="bg-gray-800/50 rounded-lg p-3 text-center">
                <div class="text-gray-400 text-xs mb-1">Маршрут</div>
                <div class="text-lg font-bold text-white">${lead.final_route?.replace('_FLOW', '') || '-'}</div>
            </div>
        </div>
        
        ${lead.llm_reason ? `
        <div class="bg-gray-800/50 rounded-lg p-3">
            <div class="text-gray-400 text-xs mb-2">Причина оценки LLM</div>
            <div class="text-white text-sm">${lead.llm_reason}</div>
        </div>
        ` : ''}
        
        <div class="bg-gray-800/50 rounded-lg p-3">
            <div class="text-gray-400 text-xs mb-2">Заявка</div>
            <div class="space-y-1 text-sm">
                <div><span class="text-gray-400">Платформа:</span> <span class="text-white">${lead.bot_platform || '-'}</span></div>
                <div><span class="text-gray-400">Старт:</span> <span class="text-white">${lead.start_window || '-'}</span></div>
                <div><span class="text-gray-400">Ссылка:</span> <span class="text-white">${lead.contact_link || '-'}</span></div>
            </div>
        </div>
        
        <div class="flex gap-2 pt-2">
            <select id="statusSelect" class="flex-1 px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white text-sm">
                <option value="NEW" ${lead.status === 'NEW' ? 'selected' : ''}>Новый</option>
                <option value="IN_REVIEW" ${lead.status === 'IN_REVIEW' ? 'selected' : ''}>На рассмотрении</option>
                <option value="CONTACTED" ${lead.status === 'CONTACTED' ? 'selected' : ''}>Связались</option>
                <option value="WON" ${lead.status === 'WON' ? 'selected' : ''}>Выигран</option>
                <option value="LOST" ${lead.status === 'LOST' ? 'selected' : ''}>Потерян</option>
            </select>
            <button onclick="updateLeadStatus(${lead.id})" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm">
                Сохранить
            </button>
        </div>
    `;
}

// Обновить статус лида
async function updateLeadStatus(leadId) {
    const status = document.getElementById('statusSelect').value;
    try {
        const resp = await fetch(`/api/leads/${leadId}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        if (resp.ok) {
            closeLeadModal();
            loadLeads();
            loadStats();
        }
    } catch (e) {
        alert('Ошибка: ' + e.message);
    }
}

// Закрыть модальное окно
function closeLeadModal() {
    document.getElementById('leadDetailModal').classList.add('hidden');
}

// Закрытие по клику вне модального окна
document.getElementById('leadDetailModal').addEventListener('click', function(e) {
    if (e.target === this) closeLeadModal();
});

// Инициализация
document.addEventListener('DOMContentLoaded', function() {
    loadStats();
    loadLeads();
});

// Фильтры
document.getElementById('filterGrade').addEventListener('change', loadLeads);
document.getElementById('filterStatus').addEventListener('change', loadLeads);
</script>
{% endblock %}
