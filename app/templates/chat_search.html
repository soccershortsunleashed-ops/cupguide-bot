{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-5">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="text-white text-3xl font-bold mb-2">🔍 Поиск чатов</h1>
            <p class="text-gray-400">Поиск тематических чатов в Telegram по ключевым словам</p>
        </div>
    </div>

    <!-- Статистика -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl p-4">
            <div class="text-3xl font-bold text-white" id="totalChats">0</div>
            <div class="text-gray-400 text-sm">Всего чатов</div>
        </div>
        <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl p-4">
            <div class="text-3xl font-bold text-green-400" id="relevantChats">0</div>
            <div class="text-gray-400 text-sm">Релевантных</div>
        </div>
        <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl p-4">
            <div class="text-3xl font-bold text-blue-400" id="joinedChats">0</div>
            <div class="text-gray-400 text-sm">Вступили</div>
        </div>
        <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl p-4">
            <div class="text-3xl font-bold text-yellow-400" id="keywordsCount">0</div>
            <div class="text-gray-400 text-sm">Ключевых слов</div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Левая колонка: Управление поиском -->
        <div class="lg:col-span-1 space-y-4">
            <!-- Запуск поиска -->
            <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl p-4">
                <h2 class="text-white text-lg font-bold mb-3">🚀 Запуск поиска</h2>
                <button id="startSearchBtn" onclick="startSearch()" 
                    class="w-full px-4 py-3 bg-primary hover:bg-primary/80 text-white rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined">search</span>
                    Начать поиск
                </button>
                <div id="searchProgress" class="hidden mt-3">
                    <div class="flex items-center gap-2 text-white/70 text-sm">
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-primary"></div>
                        <span id="searchStatus">Поиск...</span>
                    </div>
                    <div class="mt-2 bg-white/10 rounded-full h-2">
                        <div id="searchProgressBar" class="bg-primary h-2 rounded-full transition-all" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Ключевые слова -->
            <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl p-4">
                <h2 class="text-white text-lg font-bold mb-3">📝 Ключевые слова</h2>
                <textarea id="keywordsInput" rows="10" 
                    class="w-full bg-black/20 border border-white/20 rounded-lg text-white px-3 py-2 text-sm focus:ring-primary focus:border-primary"
                    placeholder="Введите ключевые слова (каждое с новой строки)"></textarea>
                <div class="flex gap-2 mt-3">
                    <button onclick="saveKeywords()" class="flex-1 px-3 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm">
                        Сохранить
                    </button>
                    <button onclick="loadDefaultKeywords()" class="flex-1 px-3 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg text-sm">
                        По умолчанию
                    </button>
                </div>
            </div>
        </div>

        <!-- Правая колонка: Список чатов -->
        <div class="lg:col-span-2">
            <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl p-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-white text-lg font-bold">📋 Найденные чаты</h2>
                    <div class="flex gap-2">
                        <select id="filterRelevance" onchange="filterChats()" 
                            class="bg-black/20 border border-white/20 rounded-lg text-white px-3 py-1 text-sm">
                            <option value="">Все</option>
                            <option value="HIGH">Высокая релевантность</option>
                            <option value="MEDIUM">Средняя</option>
                            <option value="LOW">Низкая</option>
                            <option value="UNKNOWN">Не оценено</option>
                        </select>
                        <button onclick="loadChats()" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm">
                            <span class="material-symbols-outlined align-middle" style="font-size: 18px;">refresh</span>
                        </button>
                    </div>
                </div>
                
                <div id="chatsList" class="space-y-2 max-h-[600px] overflow-y-auto">
                    <div class="text-center text-gray-400 py-8">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let allChats = [];

// Загрузка чатов
async function loadChats() {
    try {
        const res = await fetch('/api/chat-search/chats');
        const data = await res.json();
        allChats = data.chats || [];
        
        document.getElementById('totalChats').textContent = data.total || 0;
        document.getElementById('relevantChats').textContent = data.relevant || 0;
        document.getElementById('joinedChats').textContent = data.joined || 0;
        
        renderChats(allChats);
    } catch (e) {
        console.error('Error loading chats:', e);
        document.getElementById('chatsList').innerHTML = '<div class="text-center text-red-400 py-4">Ошибка загрузки</div>';
    }
}

// Отрисовка чатов
function renderChats(chats) {
    const container = document.getElementById('chatsList');
    
    if (!chats.length) {
        container.innerHTML = '<div class="text-center text-gray-400 py-8">Чаты не найдены. Запустите поиск.</div>';
        return;
    }
    
    container.innerHTML = chats.map(chat => `
        <div class="bg-black/20 rounded-lg p-3 hover:bg-black/30 transition-colors">
            <div class="flex justify-between items-start">
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <span class="text-white font-medium">${escapeHtml(chat.title)}</span>
                        ${chat.is_verified ? '<span class="text-blue-400">✓</span>' : ''}
                    </div>
                    <div class="text-gray-400 text-sm">@${chat.username} • ${chat.members_count || '?'} участников</div>
                    <div class="text-gray-500 text-xs mt-1">
                        ${(chat.keywords_matched || []).slice(0, 3).join(', ')}${chat.keywords_matched?.length > 3 ? '...' : ''}
                    </div>
                </div>
                <div class="flex flex-col items-end gap-1">
                    <span class="px-2 py-0.5 rounded text-xs ${getRelevanceClass(chat.relevance_level)}">
                        ${chat.relevance_level || 'N/A'}
                    </span>
                    ${chat.is_joined ? '<span class="text-green-400 text-xs">✓ Вступили</span>' : ''}
                </div>
            </div>
            <div class="flex gap-2 mt-2">
                <a href="https://t.me/${chat.username}" target="_blank" 
                    class="px-2 py-1 bg-blue-600/20 text-blue-400 rounded text-xs hover:bg-blue-600/30">
                    Открыть
                </a>
                ${!chat.is_joined ? `
                <button onclick="joinChat('${chat.tg_chat_id}')" 
                    class="px-2 py-1 bg-green-600/20 text-green-400 rounded text-xs hover:bg-green-600/30">
                    Вступить
                </button>` : ''}
            </div>
        </div>
    `).join('');
}

function getRelevanceClass(level) {
    switch(level) {
        case 'HIGH': return 'bg-green-600/20 text-green-400';
        case 'MEDIUM': return 'bg-yellow-600/20 text-yellow-400';
        case 'LOW': return 'bg-red-600/20 text-red-400';
        default: return 'bg-gray-600/20 text-gray-400';
    }
}

// Фильтрация
function filterChats() {
    const filter = document.getElementById('filterRelevance').value;
    const filtered = filter ? allChats.filter(c => c.relevance_level === filter) : allChats;
    renderChats(filtered);
}

// Загрузка ключевых слов
async function loadKeywords() {
    try {
        const res = await fetch('/api/chat-search/keywords');
        const data = await res.json();
        document.getElementById('keywordsInput').value = (data.keywords || []).join('\n');
        document.getElementById('keywordsCount').textContent = data.keywords?.length || 0;
    } catch (e) {
        console.error('Error loading keywords:', e);
    }
}

// Сохранение ключевых слов
async function saveKeywords() {
    const text = document.getElementById('keywordsInput').value;
    const keywords = text.split('\n').map(k => k.trim()).filter(k => k);
    
    if (keywords.length === 0) {
        alert('Введите хотя бы одно ключевое слово');
        return;
    }
    
    try {
        const res = await fetch('/api/chat-search/keywords', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({keywords})
        });
        const data = await res.json();
        
        if (data.status === 'ok') {
            // Обновляем textarea с очищенными ключевыми словами
            if (data.keywords) {
                document.getElementById('keywordsInput').value = data.keywords.join('\n');
            }
            document.getElementById('keywordsCount').textContent = data.count || keywords.length;
            alert(`Сохранено ${data.count} ключевых слов!`);
        } else {
            alert('Ошибка сохранения');
        }
    } catch (e) {
        console.error('Error saving keywords:', e);
        alert('Ошибка сохранения: ' + e.message);
    }
}

// Загрузка дефолтных ключевых слов
async function loadDefaultKeywords() {
    try {
        const res = await fetch('/api/chat-search/keywords/default');
        const data = await res.json();
        document.getElementById('keywordsInput').value = (data.keywords || []).join('\n');
        document.getElementById('keywordsCount').textContent = data.keywords?.length || 0;
    } catch (e) {
        console.error('Error:', e);
    }
}

// Запуск поиска
async function startSearch() {
    const btn = document.getElementById('startSearchBtn');
    const progress = document.getElementById('searchProgress');
    
    btn.disabled = true;
    btn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div> Поиск...';
    progress.classList.remove('hidden');
    
    try {
        const res = await fetch('/api/chat-search/start', {method: 'POST'});
        const data = await res.json();
        
        if (data.status === 'started') {
            pollSearchStatus();
        } else {
            alert(data.message || 'Ошибка запуска');
            resetSearchButton();
        }
    } catch (e) {
        alert('Ошибка: ' + e.message);
        resetSearchButton();
    }
}

// Опрос статуса поиска
async function pollSearchStatus() {
    try {
        const res = await fetch('/api/chat-search/status');
        const data = await res.json();
        
        document.getElementById('searchStatus').textContent = data.message || 'Поиск...';
        document.getElementById('searchProgressBar').style.width = (data.progress || 0) + '%';
        
        if (data.status === 'running') {
            setTimeout(pollSearchStatus, 2000);
        } else {
            resetSearchButton();
            loadChats();
        }
    } catch (e) {
        resetSearchButton();
    }
}

function resetSearchButton() {
    const btn = document.getElementById('startSearchBtn');
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined">search</span> Начать поиск';
    document.getElementById('searchProgress').classList.add('hidden');
}

// Вступление в чат
async function joinChat(chatId) {
    try {
        const res = await fetch(`/api/chat-search/join/${chatId}`, {method: 'POST'});
        const data = await res.json();
        alert(data.message || 'Готово');
        loadChats();
    } catch (e) {
        alert('Ошибка: ' + e.message);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
    loadChats();
    loadKeywords();
});
</script>
{% endblock %}
